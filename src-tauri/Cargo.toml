[package]
name = "clavelocal"
version = "0.3.1"
description = "Bóveda local de contraseñas"
edition = "2021"
license = "MIT"
rust-version = "1.90"
default-run = "clavelocal"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "=2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
minisign-verify = "0.3"
semver = "1"
