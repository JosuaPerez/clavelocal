[package]
name = "clavelocal"
version = "0.5.0"
description = "Bóveda local de contraseñas"
edition = "2021"
license = "MIT"
rust-version = "1.90"
default-run = "clavelocal"

[workspace]
members = ["security/glib-regression"]
exclude = ["vendor/glib-0.18.5"]
default-members = ["."]
resolver = "2"

[patch.crates-io]
# Upstream fix backported verbatim; provenance checked by test/vendor.test.mjs.
glib = { path = "vendor/glib-0.18.5" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "=2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
minisign-verify = "0.3"
semver = "1"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
