name: Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: windows-installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: rustup default stable
      - run: npm run desktop:build
      - run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin verify-update
      - name: Hash del instalador
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $digest = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($digest.Hash.ToLower())  $($_.Name)" | Out-File -FilePath src-tauri/target/release/bundle/nsis/SHA256SUMS.txt -Encoding utf8
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clavelocal-windows-preview
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/Cargo.lock
            src-tauri/target/release/verify-update.exe
          if-no-files-found: error
          retention-days: 14
